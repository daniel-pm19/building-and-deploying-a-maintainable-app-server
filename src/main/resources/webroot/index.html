<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Framework — Demo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header class="topbar">
        <img id="logo" src="/images/logo.png" alt="Logo de la aplicación">
        <h1>My Web Framework</h1>
    </header>

    <main class="content">

        <section class="card">
            <h2>GET /hello · lambda dinámica</h2>
            <div class="row">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Your name" value="Pedro">
            </div>
            <div class="row">
                <label for="language">Language</label>
                <select id="language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fra">Français</option>
                </select>
            </div>
            <button id="btn-hello">Saludar</button>
            <p id="result-hello" class="result">—</p>
        </section>

        <section class="card">
            <h2>GET /pi · lambda dinámica</h2>
            <button id="btn-pi">Dar &pi;</button>
            <p id="result-pi" class="result">—</p>
        </section>

        <section class="card">
            <h2>GET /e · lambda dinámica</h2>
            <button id="btn-e">Dar e</button>
            <p id="result-e" class="result">—</p>
        </section>

        <section class="card">
            <h2>GET /sin · lambda dinámica</h2>
            <div class="row">
                <label for="n">n (rad)</label>
                <input id="n" type="text" placeholder="Valor en radianes" value="3">
            </div>
            <button id="btn-sin">Calcular seno</button>
            <p id="result-sin" class="result">—</p>
        </section>

        <section class="card">
            <h2>GET /images · lambda dinámica</h2>
            <div class="row">
                <label for="imageid">Image id</label>
                <input id="imageid" type="text" placeholder="logo" value="logo">
            </div>
            <button id="btn-images">Buscar imagen</button>
            <p id="result-images" class="result">—</p>
        </section>

    </main>

    <footer class="footer">
        <p>Recurso binario servido por el framework: <code>/images/logo.png</code></p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
